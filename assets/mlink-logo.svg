  <text x="312" y="180" fill="#FFD022" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="0.16em">ONE MEMORY PLANE · YOUR MODELS STAY YOURS</text>

